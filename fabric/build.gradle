import me.modmuss50.mpp.ReleaseType
import net.fabricmc.loom.task.RemapJarTask
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "$loom_version"
	id "me.modmuss50.mod-publish-plugin" version "$mod_publish_version"
	id "org.jetbrains.kotlin.jvm"
}

version = "${project.mod_version}"
group = "${project.maven_group}"

def releaseVersion = project.version.toString()

def releaseChangelog = providers.fileContents(layout.projectDirectory.file("../CHANGELOG.md")).asText.map { changelog ->
	def releaseHeading = "## [${releaseVersion}]"
	def changelogLines = changelog.readLines()
	def sectionStart = changelogLines.findIndexOf { line ->
		line == releaseHeading || line.startsWith("${releaseHeading} - ")
	}

	if (sectionStart < 0) {
		throw new GradleException("CHANGELOG.md does not contain a section for version ${releaseVersion}")
	}

	def relativeSectionEnd = changelogLines.subList(sectionStart + 1, changelogLines.size()).findIndexOf { line -> line.startsWith("## [") }
	def sectionEnd = relativeSectionEnd < 0 ? changelogLines.size() : sectionStart + 1 + relativeSectionEnd
	def releaseNotes = changelogLines.subList(sectionStart + 1, sectionEnd).join("\n").trim()

	if (releaseNotes.isEmpty()) {
		throw new GradleException("CHANGELOG.md section for version ${releaseVersion} is empty")
	}

	return releaseNotes
}

def releaseType = providers.gradleProperty("releaseType").orElse("STABLE").map { configuredType ->
	try {
		return ReleaseType.valueOf(configuredType.toUpperCase(Locale.ROOT))
	} catch (IllegalArgumentException ignored) {
		throw new GradleException("Unsupported release type '${configuredType}'. Expected STABLE, BETA, or ALPHA.")
	}
}

base {
	archivesName = "${project.archives_base_name}"
}

repositories {
	maven { url = uri("https://maven.misterpemodder.com/libs-release/") }
	maven { url = uri("https://maven.shedaniel.me/") }
	maven { url = uri("https://maven.blamejared.com/") }
	maven { url = uri("https://maven.architectury.dev/") }
	maven {
		name = "Terraformers"
		url = uri("https://maven.terraformersmc.com/")
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = uri("https://api.modrinth.com/maven")
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

def commonCodeDir = project(':common').file('src/main/kotlin')
def commonResourcesDir = project(':common').file('src/main/resources')
def commonGeneratedDir = project(':common').file('src/main/generated')
def commonClientCodeDir = project(':common').file('src/client/kotlin')

sourceSets {
	main {
		resources {
			srcDirs += commonGeneratedDir
			exclude '.cache/**'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"wooden_accents_mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		// This adds a new gradle task that runs the datagen API: "gradlew runDatagen"
		datagen {
			inherit server
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${commonGeneratedDir}"
			vmArg "-Dfabric-api.datagen.modid=$archives_base_name"

			runDir "build/datagen"
		}

		client {
			client()
			configName = "Fabric Client"
			ideConfigGenerated(true)
		}
		server {
			server()
			configName = "Fabric Server"
			ideConfigGenerated(true)
		}
	}

	accessWidenerPath = project(":common").loom.accessWidenerPath
}

// Recompile the loader-agnostic common sources against Fabric's named Minecraft mappings.
kotlin {
	sourceSets {
		main {
			kotlin {
				srcDir commonCodeDir
			}
		}
		client {
			kotlin {
				srcDir commonCodeDir
				srcDir commonClientCodeDir
			}
		}
	}
}

sourceSets.main.java {
	srcDir project(':common').file('src/main/java')
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
	testImplementation "junit:junit:4.13.2"
	testImplementation "org.mockito:mockito-core:5.23.0"
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	modImplementation("com.misterpemodder:shulkerboxtooltip-fabric:${project.shulker_box_tooltip_version}") { transitive = false }
	modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modImplementation "maven.modrinth:voxlib:${project.voxlib_version}"
	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
	modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}") {
		exclude(group: "net.fabricmc.fabric-api")
		exclude(group: "net.fabricmc", module: "fabric-loader")
	}
	// Makes VoxLib's shape debugger accessible in development without shipping Mod Menu.
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Loom's development remap drops VoxLib's nested-jar declaration, so provide its embedded library at runtime.
	runtimeOnly("com.github.ben-manes.caffeine:caffeine:${project.caffeine_version}") {
		exclude(group: "org.checkerframework", module: "checker-qual")
		exclude(group: "com.google.errorprone", module: "error_prone_annotations")
	}
}

processResources {
	def projectVersion = version
	inputs.property "version", projectVersion

	// Hand-made common resources; duplicates resolve in favor of hand-made content.
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	from(commonResourcesDir)

	filesMatching("fabric.mod.json") {
		expand "version": projectVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release.set(21)
}

kotlin {
	compilerOptions {
		jvmTarget = JvmTarget.JVM_21
	}
}

tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
	// Capture indices_base property up front so the rename closure stays
	// compatible with the Gradle configuration cache.
	def baseName = archives_base_name
	from("../LICENSE") {
		rename { "${it}_${baseName}" }
	}
}

publishMods {
	file = remapJar.archiveFile
	changelog = releaseChangelog
	type = releaseType
	displayName = "Wooden Accents Mod ${project.version}"
	modLoaders.add("fabric")
	dryRun = providers.gradleProperty("dryRun").map { it.toBoolean() }.orElse(false)

	github {
		accessToken = providers.environmentVariable("GITHUB_TOKEN")
		repository = "The-Mystora-Project/WoodenAccentsMod"
		commitish = providers.environmentVariable("GITHUB_SHA").orElse("master")
		tagName = "v${project.version}"
		additionalFiles.from(remapSourcesJar.archiveFile)
		additionalFiles.from(project(':neoforge').layout.buildDirectory.file("libs/${project.archives_base_name}-neoforge-${project.mod_version}.jar"))
		additionalFiles.from(project(':neoforge').layout.buildDirectory.file("libs/${project.archives_base_name}-neoforge-${project.mod_version}-sources.jar"))
	}
}

tasks.named('publishGithub') {
	dependsOn ':neoforge:jar', ':neoforge:sourcesJar'
}

// Exercise shared bookshelf behavior on Minecraft's supported runtime, including in CI.
tasks.named("test", Test) {
	workingDir = layout.buildDirectory.dir("tests").get().asFile
	doFirst {
		workingDir.mkdirs()
	}
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
	}
}
