name: build

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2204, blacksmith-4vcpu-windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      # The Gradle daemon requires Java 25 (see gradle/gradle-daemon-jvm.properties from the 1.20.6 port).
      - name: setup jdk 21 and 25
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: validate generated resources
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          ./gradlew :fabric:runDatagen
          if [[ -n "$(git status --porcelain --untracked-files=all -- common/src/main/generated)" ]]; then
            git status --short --untracked-files=all -- common/src/main/generated
            git diff -- common/src/main/generated
            exit 1
          fi
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            fabric/build/libs/
            neoforge/build/libs/
