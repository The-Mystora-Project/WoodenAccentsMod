name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: STABLE
        type: choice
        options:
          - STABLE
          - BETA
          - ALPHA
      dry_run:
        description: Validate and package the release without publishing
        required: true
        default: true
        type: boolean
      confirm_release:
        description: Confirm real publication to GitHub Releases
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    env:
      RELEASE_TYPE: ${{ inputs.release_type }}
      DRY_RUN: ${{ inputs.dry_run }}
      CONFIRM_RELEASE: ${{ inputs.confirm_release }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk 21 and 25
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: temurin

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: validate release request
        id: release
        shell: bash
        run: |
          set -euo pipefail

          release_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ -z "$release_version" ]]; then
            echo "gradle.properties does not define mod_version" >&2
            exit 1
          fi

          if [[ "$DRY_RUN" != "true" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
              echo "Real releases must run from master, not $GITHUB_REF" >&2
              exit 1
            fi

            if [[ "$CONFIRM_RELEASE" != "true" ]]; then
              echo "Real releases require the confirm_release checkbox" >&2
              exit 1
            fi
          fi

          release_tag="v$release_version"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

          {
            echo "### Release request"
            echo "- Version: \`$release_version\`"
            echo "- Type: \`$RELEASE_TYPE\`"
            echo "- Dry run: \`$DRY_RUN\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: check for existing releases
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub tag $RELEASE_TAG already exists" >&2
            exit 1
          fi

      - name: validate release package
        run: ./gradlew clean publishMods -PdryRun=true "-PreleaseType=$RELEASE_TYPE"

      - name: capture dry-run artifacts
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-${{ steps.release.outputs.version }}
          path: fabric/build/publishMods/
          retention-days: 7

      - name: publish to github
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishGithub -PdryRun=false "-PreleaseType=$RELEASE_TYPE"

      - name: summarize publication
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "### Publication complete"
            echo "- GitHub: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"
